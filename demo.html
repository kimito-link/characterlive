<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>characterlive — 3人がふわふわしているだけのページ</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #eef3f8;
        --panel: #ffffff;
        --ink: #23303f;
        --muted: #5c6b7a;
        --line: #d5dee7;
        --accent: #2f3a46;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #141a21;
          --panel: #1d252e;
          --ink: #e8eef5;
          --muted: #9aa8b6;
          --line: #333f4c;
          --accent: #cbd7e3;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        font: 14px/1.6 system-ui, "Segoe UI", "Hiragino Kaku Gothic ProN", sans-serif;
        display: flex;
        flex-direction: column;
      }
      header {
        padding: 18px 20px 10px;
        text-align: center;
      }
      h1 { font-size: 17px; margin: 0 0 4px; }
      header p { margin: 0; color: var(--muted); font-size: 12.5px; }

      /*
       * ★キャラの mount 先。body 直下ではなくこの箱に入れる。
       *   移植元(追憶)では body 直下に置いて全画面要素に覆われ、一度も見えなかった。
       */
      #stage {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 10px 16px 24px;
        /* 立ち絵が乗る「床」。透過PNGの輪郭が見えるように少し沈んだ色にする。 */
        background:
          radial-gradient(ellipse 70% 45% at 50% 78%, rgba(120, 160, 200, 0.16), transparent 70%);
      }

      /* ---- 操作パネル(このデモ専用。部品側には一切入れない) ---- */
      .panel {
        border-top: 1px solid var(--line);
        background: var(--panel);
        padding: 12px 16px 16px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
        max-width: 780px;
        margin: 0 auto;
      }
      .row + .row { margin-top: 8px; }
      button {
        font: inherit;
        font-size: 12.5px;
        padding: 7px 12px;
        border-radius: 8px;
        border: 1.5px solid var(--accent);
        background: transparent;
        color: var(--ink);
        cursor: pointer;
      }
      button:hover { background: rgba(127, 127, 127, 0.12); }
      label {
        font-size: 12.5px;
        color: var(--muted);
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      #verdict {
        max-width: 780px;
        margin: 10px auto 0;
        padding: 8px 12px;
        border-radius: 8px;
        border: 1px solid var(--line);
        font-size: 12.5px;
        text-align: center;
        color: var(--muted);
        overflow-wrap: anywhere;
      }
      .hint { text-align: center; font-size: 11.5px; color: var(--muted); margin: 8px 0 0; }
    </style>
  </head>
  <body>
    <header>
      <h1>characterlive</h1>
      <p>りんく・こん太・たぬ姉が、ふわふわ浮いて喋る部品。ここは見た目と動きだけ。</p>
    </header>

    <!-- ★キャラはここに入る(mount 先) -->
    <main id="stage"></main>

    <div class="panel">
      <div class="row">
        <button data-act="react">相槌を入れる</button>
        <button data-act="answer">話しかける（誰かが答える）</button>
        <button data-act="answer-rinku">「りんく、どう思う?」</button>
        <button data-act="answer-konta">「こん太、どう思う?」</button>
        <button data-act="answer-tanunee">「たぬ姉、どう思う?」</button>
      </div>
      <div class="row">
        <button data-act="think">考え始める</button>
        <button data-act="think-end">考え終わる</button>
        <button data-act="toggle">表示/非表示</button>
        <label>
          盛り上がり
          <input id="heat" type="range" min="0" max="1" step="0.05" value="0.3" />
        </label>
        <button data-act="census">いま見えているか測る</button>
      </div>
      <div id="verdict">「いま見えているか測る」を押すと、実測して判定を出します。</div>
      <p class="hint">
        ★何を喋るか(会話AI)と声は、この部品には入っていません。受け口だけ開いています。
      </p>
    </div>

    <script type="module">
      import { startCharaLive } from './src/index.js';
      import { collectCharaLiveCensus, charaLiveVerdict } from './src/lib/charaLiveCensus.js';

      const stage = document.getElementById('stage');
      const heat = document.getElementById('heat');

      const live = startCharaLive({
        doc: document,
        mount: stage,
        // このデモはリポ直下から開くだけなので、パスはそのまま使える。
        resolveUrl: (p) => p,
        getHeatLevel: () => Number(heat.value)
      });

      /** 押した回数。相槌の文面は commentKey で決まるので、毎回変えて別の文にする。 */
      let n = 0;
      /** 相槌の「読み上げ終わり」を模す時計。実際は音声プレイヤーの終了で呼ぶ。 */
      let endTimer = 0;

      const ACTIONS = {
        react() {
          n += 1;
          live.onCommentSpoken({ commentKey: `demo:${n}` });
          // ★実運用では「音声が鳴り終わった瞬間」に呼ぶ。ここでは 2.4 秒で畳む。
          clearTimeout(endTimer);
          endTimer = setTimeout(() => live.onCommentSpokenEnd(), 2400);
        },
        answer() {
          live.onStreamerAddressed({
            prompt: 'ねえ、みんな聞いてる?',
            answer: '聞いてるよ〜！',
            durationMs: 3000
          });
        },
        'answer-rinku': () =>
          live.onStreamerAddressed({
            prompt: 'りんく、どう思う?',
            answer: 'いいと思うのだ！',
            durationMs: 3000
          }),
        'answer-konta': () =>
          live.onStreamerAddressed({
            prompt: 'こん太、どう思う?',
            answer: 'ボクは賛成だよ！',
            durationMs: 3000
          }),
        'answer-tanunee': () =>
          live.onStreamerAddressed({
            prompt: 'たぬ姉、どう思う?',
            answer: 'そうねぇ、悪くないわ',
            durationMs: 3000
          }),
        think: () => live.beginThinking({ prompt: 'たぬ姉、これってどういうこと?' }),
        'think-end': () => live.endThinking(),
        toggle: () => live.setVisible(live.root.hidden),
        census() {
          const c = collectCharaLiveCensus(document);
          const v = charaLiveVerdict(c);
          document.getElementById('verdict').textContent = v.line;
        }
      };

      document.querySelectorAll('button[data-act]').forEach((btn) => {
        btn.addEventListener('click', () => ACTIONS[btn.dataset.act]?.());
      });
    </script>
  </body>
</html>
