<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>characterlive — 話してみる</title>
    <style>
      /*
       * ★この画面の目的（2026-09-04）
       *   ユーザーの言葉:「動画がみたいのではない。実際に自分が会話して、
       *   grokと会話するみたいにして同じ感覚が得られるかが重要。
       *   今回の場合は、3人にいるので違う感覚かも」
       *   → 読んで判断するのは無理。**触って確かめる**ための画面。
       *   LP(index.html)とは別に置く。これは開発用。
       */
      :root {
        color-scheme: light;
        --navy: #1c4b7d; --navy-deep: #14375c; --orange: #c8721c;
        --bg: #fffaf4; --bg2: #fff3e6; --panel: #fff; --ink: #2c2117;
        --muted: #5f5346; --line: #e8dccd; --ok: #1a7f5a; --ng: #b3261e;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
        font: 15px/1.8 system-ui, "Segoe UI", "Hiragino Kaku Gothic ProN", sans-serif;
        display: flex; flex-direction: column;
      }
      header { padding: 12px 18px; border-bottom: 1px solid var(--line); background: var(--panel); }
      header h1 { font-size: 15px; margin: 0; color: var(--navy-deep); }
      header .st { font-size: 12px; color: var(--muted); margin-top: 3px; }
      .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; }
      .dot.ok { background: var(--ok); } .dot.ng { background: var(--ng); }

      /* キャラの舞台
       * ★大きさは画面幅に連動させる（2026-09-14・ユーザー報告「吹き出しのバランスが悪い」）
       *   部品の既定は 1人160px・吹き出し240px/12px で固定。1024px幅では舞台が広いのに
       *   吹き出しだけ小さく、375px幅では3人が収まらない。
       *   → キャラ・吹き出しの幅・文字の大きさを同じ変数から派生させ、幅が変わっても釣り合いを保つ。
       *   ★数値は 375/768/1024/1440 の4幅で実測して決めた（横スクロール0・48字が6行以内）。 */
      #stage {
        --chara: clamp(96px, 17vw, 210px);           /* 1人の大きさ */
        --bubble-w: clamp(220px, 36vw, 440px);        /* 吹き出しの最大幅（48字が3〜4行） */
        --bubble-fs: clamp(13px, 1.6vw, 18px);        /* 吹き出しの文字（1024px で約16px） */
        flex: 1; min-height: calc(var(--chara) + 140px); display: flex;
        align-items: flex-end; justify-content: center; padding: 12px 10px 6px;
        background: radial-gradient(ellipse 62% 40% at 50% 86%, rgba(28,75,125,.10), transparent 72%);
      }
      #stage .nlcl-stage { gap: clamp(8px, 3vw, 44px); }
      #stage .nlcl-chara { width: var(--chara); height: var(--chara); }
      #stage .nlcl-chara__bubble {
        max-width: var(--bubble-w); font-size: var(--bubble-fs);
        padding: calc(var(--bubble-fs) * 0.55) calc(var(--bubble-fs) * 0.9);
        border-radius: calc(var(--bubble-fs) * 1.1);
        bottom: calc(100% + 10px);
      }
      #stage .nlcl-chara__name { font-size: calc(var(--bubble-fs) * 0.8); margin-bottom: 2px; }
      /* ★端の子の吹き出しが画面外へ出ないように、左右端では吹き出しを内側へ寄せる
         ★部品の登場アニメーション（nlcl-pop）が transform に translateX(-50%) を含むので、
           transform:none だけでは打ち消される（実測: 375px で りんく の吹き出しが left=-85px）。
           → 端の子だけ translateX の無いアニメーションに差し替える。 */
      #stage .nlcl-chara:first-child .nlcl-chara__bubble,
      #stage .nlcl-chara:last-child .nlcl-chara__bubble { animation-name: talk-pop-edge; transform: none; }
      #stage .nlcl-chara:first-child .nlcl-chara__bubble { left: 0; }
      #stage .nlcl-chara:first-child .nlcl-chara__bubble::after { left: calc(var(--chara) / 2); }
      #stage .nlcl-chara:last-child .nlcl-chara__bubble { left: auto; right: 0; }
      #stage .nlcl-chara:last-child .nlcl-chara__bubble::after { left: auto; right: calc(var(--chara) / 2 - 6px); }
      @keyframes talk-pop-edge {
        from { opacity: 0; transform: translateY(4px) scale(0.94); }
        to   { opacity: 1; transform: none; }
      }

      /* 会話ログ
       * ★高さを固定する（2026-09-14・ユーザー報告「ログが溜まると上に行く」）
       *   以前は max-height:34vh で、溜まるほど舞台を押し上げていた。
       *   → 高さを固定し、中だけスクロールさせる。たたむ／別ウィンドウで分離もできる。 */
      .logbar {
        display: flex; align-items: center; justify-content: space-between; gap: 8px;
        padding: 6px 18px; border-top: 1px solid var(--line); background: var(--bg2);
        font-size: 12px; color: var(--muted);
      }
      .logbar__btns { display: flex; gap: 6px; flex: none; }
      .logbar__last {
        flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        color: var(--ink); font-size: 13px;
      }
      /* ログが見えているときは重複するので出さない */
      body:not(.log-folded):not(.log-detached) .logbar__last { visibility: hidden; }
      #log {
        height: clamp(120px, 22vh, 240px); overflow-y: auto; padding: 8px 18px 10px;
        background: var(--bg2);
      }
      body.log-folded #log, body.log-detached #log { display: none; }
      .msg { margin: 0 0 8px; font-size: 14px; display: flex; gap: 8px; align-items: flex-start; }
      .msg b { color: var(--navy-deep); }
      .msg.me { color: var(--muted); }
      .msg.me .msg__body { background: #fff; border-radius: 10px; padding: 2px 10px; }
      .msg .ms { font-size: 11px; color: var(--muted); margin-left: 6px; }
      /* ★発言者アイコン。あなた＝マイクのバッジ／3人＝顔／それ以外＝点 */
      .av { flex: none; position: relative; width: 28px; height: 28px; margin-top: 1px; }
      .av img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
      .av--me { border-radius: 50%; background: var(--orange); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 15px; }
      .av--sys::before { content: ""; position: absolute; left: 11px; top: 11px; width: 6px; height: 6px; border-radius: 50%; background: var(--line); }

      /* 入力 */
      .bar { padding: 12px 18px 18px; background: var(--panel); border-top: 1px solid var(--line); }
      .row { display: flex; gap: 8px; max-width: 720px; margin: 0 auto; }
      input[type="text"] {
        flex: 1; font: inherit; padding: 12px 14px;
        border: 1.5px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink);
      }
      input[type="text"]:focus { outline: 2px solid var(--navy); border-color: transparent; }
      button {
        font: inherit; font-weight: 700; padding: 12px 20px; border: 0; border-radius: 10px;
        background: var(--orange); color: #fff; cursor: pointer; min-height: 44px;
      }
      button:disabled { opacity: .5; cursor: default; }
      .opts { display: flex; gap: 14px; flex-wrap: wrap; max-width: 720px; margin: 10px auto 0; font-size: 13px; color: var(--muted); }
      .opts label { display: inline-flex; align-items: center; gap: 5px; }
      select { font: inherit; font-size: 13px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 7px; }
      .hint { max-width: 720px; margin: 8px auto 0; font-size: 12px; color: var(--muted); }

      /* ★声を選ぶ欄 */
      .voices { max-width: 720px; margin: 12px auto 0; border-top: 1px solid var(--line); padding-top: 10px; }
      .voices__head { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
      .voices__list { display: grid; gap: 7px; }
      .vrow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .vrow > b { font-size: 13px; color: var(--navy-deep); min-width: 3.6em; }
      .vrow select { flex: 1; min-width: 140px; max-width: 320px; }
      /* ★試聴ボタンは必須。名前だけでは声を選べない */
      .mini {
        font: inherit; font-size: 12px; font-weight: 600; padding: 6px 12px; min-height: 32px;
        border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--navy);
      }
      .mini:disabled { opacity: .5; }

      /* ★マイク（押している間だけ聞く） */
      .mic {
        background: #fff; border: 1.5px solid var(--line); color: var(--navy);
        padding: 0; width: 52px; min-height: 48px; font-size: 20px; line-height: 1;
        display: flex; align-items: center; justify-content: center;
        touch-action: none; user-select: none;
      }
      .mic:hover { border-color: var(--navy); }
      /* ★押している間は一目で分かるようにする（聞かれていることを隠さない） */
      .mic.is-on {
        background: var(--ng); border-color: var(--ng); color: #fff;
        box-shadow: 0 0 0 4px rgba(179,38,30,.18);
      }
      .mic.is-on .mic__icon { animation: micPulse 1.1s ease-in-out infinite; }
      @keyframes micPulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
      .mic:disabled { opacity: .4; }

      /* ★音量の波形。押している間だけ出す。
         これが動く = マイクが本当に音を拾えている、の証拠になる。 */
      /* ★<span> の中なので inline-flex にする。
         flex にすると <button> 内のインライン整形文脈で子の高さが潰れ、
         棒が 3px から動かなかった（!important でも効かず、実測で原因を特定）。 */
      .mic__bars { display: inline-flex; align-items: center; gap: 2px; height: 20px; margin-left: 2px; vertical-align: middle; }
      .mic__bars[hidden] { display: none !important; }
      .mic__bars i {
        /* ★高さそのものを変える。
           当初は transform:scaleY で伸ばしたが、基準の高さが3pxしかなく
           見た目がほとんど動かなかった（実測で判明）。
           棒5本だけなのでレイアウト負荷は問題にならない。 */
        /* ★動かすのは transform:scaleY。height は使わない。
           ★実測で確定(2026-09-04): この構造では height を変えても computed が
             3px のまま動かない（!important でも、CSS変数経由でも駄目）。
             transition:height が変更を吸収していた。
             一方 transform は確実に効く（scaleY(6) で実測18px）。
           ★基準の高さは 16px にする。最初 3px で作ったせいで
             scaleY をかけても見た目がほとんど動かず「効いていない」と誤診した。 */
        display: block; width: 3px; height: 16px; border-radius: 2px;
        background: currentColor; opacity: .9;
        flex: none;
        transform: scaleY(0.19);        /* 無音時 = 約3px */
        transform-origin: center;
        transition: transform .06s linear;
      }
      /* ★押していて音が来ない時の注意書き */
      .state__warn { color: var(--ng); font-weight: 600; }

      /* ★マイクの許可状態（常時表示） */
      .micst {
        max-width: 720px; margin: 6px auto 0; font-size: 12px; color: var(--muted);
        display: flex; align-items: center; gap: 6px;
      }
      .micst__dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: none; }
      .micst.is-ok .micst__dot { background: var(--ok); }
      .micst.is-live .micst__dot { background: var(--ng); animation: micPulse 1.1s ease-in-out infinite; }
      .micst.is-ng .micst__dot { background: var(--ng); }
      .micst.is-ng { color: var(--ng); }

      /* ★状態の3段階: 聞いてる / 考えてる / 喋ってる */
      .state {
        max-width: 720px; margin: 8px auto 0; display: flex; align-items: center; gap: 7px;
        font-size: 12px; color: var(--muted);
      }
      /* ★display:flex は hidden 属性より強い。明示しないと隠しても見えたままになる。 */
      .state[hidden] { display: none; }
      .state__dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
      .state[data-s="listening"] .state__dot { background: var(--ng); animation: micPulse 1.1s ease-in-out infinite; }
      .state[data-s="thinking"]  .state__dot { background: var(--orange); animation: micPulse .8s ease-in-out infinite; }
      .state[data-s="speaking"]  .state__dot { background: var(--ok); }
    </style>
  </head>
  <body>
    <header>
      <h1>characterlive — 話してみる（開発用）</h1>
      <div class="st" id="status">確認中…</div>
    </header>

    <main id="stage"></main>

    <!-- ★ログは舞台を押さない（高さ固定）。たたむ／別ウィンドウで分離できる（2026-09-14） -->
    <div class="logbar">
      <span>会話ログ</span>
      <!-- ★ログをたたんだ／別窓に出した間も、最後のやりとりだけは本体に見せる（届いたことが分かるように） -->
      <span id="logLast" class="logbar__last"></span>
      <span class="logbar__btns">
        <button type="button" id="logFold" class="mini" title="ログ欄を隠して舞台を広くします">たたむ</button>
        <button type="button" id="logPop" class="mini" title="ログを別ウィンドウに出します（配信画面と分けられます）">別ウィンドウ</button>
      </span>
    </div>
    <div id="log"></div>

    <div class="bar">
      <div class="row">
        <!-- ★押している間だけ聞く（Grok本人の助言:「常時オンは配信には向かない」）
             スペースキーでも押せる。配信中にボタンを握り続けるのは無理なので。 -->
        <button id="mic" class="mic" title="押すと聞き始めます。もう一度押すと止まります（スペースキーでも可）">
          <span class="mic__icon">🎤</span>
          <!-- ★音を拾えているかを見せる波形（ユーザー指摘:「スピーカーゲージがないので
               ほんとうにつかえてるかわかりずらい」）。押している間だけ出る。 -->
          <span class="mic__bars" id="micBars" hidden aria-hidden="true">
            <i></i><i></i><i></i><i></i><i></i>
          </span>
        </button>
        <input id="say" type="text" placeholder="🎤を押して話す、または入力（例: たぬ姉、今日うまくいかなかった）" autocomplete="off" />
        <button id="send">話す</button>
      </div>
      <!-- ★いまの状態を3段階で見せる（Grok:「点だけじゃ足りない」） -->
      <div class="state" id="state" hidden><span class="state__dot"></span><span id="stateText"></span></div>
      <!-- ★マイクの状態を押す前から見せる。
           Chromeの「マイク / 現在使用中」はブラウザが出すものでページからは作れないが、
           「いま使えるか」が一目で分かる安心感は自前で作れる。 -->
      <div class="micst" id="micState"></div>
      <!-- ★声を選ぶ（Grokの「音声 Ara ＞」と同じ位置づけ・性格とは独立）
           ユーザー指摘:「みるとどの音声入力かえらべるのがない」 -->
      <div class="voices" id="voices" hidden>
        <div class="voices__head">
          <span>声</span>
          <button type="button" id="voiceReset" class="mini">元に戻す</button>
        </div>
        <div class="voices__list" id="voiceList"></div>
      </div>

      <div class="opts">
        <!-- ★頭脳を選ぶ（2026-09-07）。同じ会話を内蔵AIと Fable 5.1 で試して差を見る。
             URL に ?brain=fable を付けても選べる。選択は localStorage に残る。 -->
        <label>
          頭脳
          <select id="brain">
            <option value="nano">内蔵AI（Gemini Nano）</option>
            <option value="fable">Claude Fable 5.1</option>
          </select>
        </label>
        <label>
          性格
          <select id="mode">
            <option value="cheer">応援</option>
            <option value="chat">ゆるい雑談</option>
            <option value="blunt">遠慮なし</option>
          </select>
        </label>
        <label><input type="checkbox" id="voice" checked /> 声を出す</label>
        <label><input type="checkbox" id="chatter" /> 勝手に喋る</label>
        <!-- ★場を聞く（2026-09-08）。既定OFF。ONの間はマイクを開きっぱなしにし、
             聞こえた話を「耳」に貯めて、拍が来たら話題に一言だけ言う。
             1対1の「押して話す」経路は変えない。 -->
        <label title="配信の場（スペース・ニコ生など）の話を貯めて、間が来たら話題に一言だけ言います"><input type="checkbox" id="room" /> 場を聞く</label>
      </div>
      <p class="hint">
        ★名前を呼ぶとその子が答えます（りんく / こん太 / たぬ姉）。呼ばなければ誰かが答えます。
      </p>
    </div>

    <script type="module">
      import { startCharaLive } from './src/index.js';
      import { think, pickResponder, probeAi, startAiDownload, setBrain, getBrain, BRAINS } from './src/lib/charaBrain.js';
      import { PERSONAS, PERSONA_IDS } from './src/lib/charaPersona.v1.js';
      import { isVoicevoxAlive, synthesize, playWav } from './src/lib/charaVoice.js';
      import {
        fetchVoiceChoices, loadVoices, saveVoices, resetVoices, sampleLine
      } from './src/lib/charaVoicePicker.js';
      import {
        canListen, createPushToTalk, probeLocalRecognition, installLocalRecognition
      } from './src/lib/charaListen.js';
      import {
        startMicLevel, micPermission, watchMicPermission, describeMicPermission
      } from './src/lib/charaMicLevel.js';
      import { MIC_END_OF_SPEECH_MS } from './src/lib/charaIdle.js';
      import { resolveTurnEnd } from './src/lib/charaTurnEnd.js';
      /* ★「場を聞く」の3部品（2026-09-08・_docs/ROOM-LISTENING-DESIGN.md）
           耳(charaTranscript) → 拍(charaBeat) → 荷物(charaDigest) → think({ room }) */
      import {
        makeTranscript, appendFinal, markBlackout, windowText, charsSince, lastHeardAt
      } from './src/lib/charaTranscript.js';
      import { resolveBeat, isStaleBeat } from './src/lib/charaBeat.js';
      import { buildRoomDigest } from './src/lib/charaDigest.js';
      /* ★前回の話を1つだけ拾う記憶（2026-09-14・採用5）。端末内（localStorage）だけ。 */
      import { remember, pickup, parseMemory, serializeMemory } from './src/lib/charaMemory.js';
      /* ★キャラ自身の声の反響を弾く（2026-09-14）。比率で判定・絶対値は使わない */
      import { isRepeatOf, isEchoOf } from './src/lib/charaReplyGuard.js';
      import {
        warmUpBackchannels, playBackchannel, shouldBackchannel
      } from './src/lib/charaBackchannel.js';
      import { createToneTracker, readTone } from './src/lib/charaVoiceTone.js';
      import { isHeartTalk, relayMembers, relayDirective, checkRelayLine } from './src/lib/charaRelay.js';

      const $ = (id) => document.getElementById(id);
      const logEl = $('log');

      // ★自発発話は既定オフ。まず「話しかけたら返る」だけを確かめたいため。
      const live = startCharaLive({
        doc: document,
        mount: $('stage'),
        resolveUrl: (p) => p,
        getHeatLevel: () => 0.35,
        chatter: false
      });

      /** 直前に喋った子（同じ子が続けて答えないように） */
      let lastSpeaker = null;
      /** 会話履歴（内蔵AIは小型なので直近だけ渡す） */
      const history = [];
      /* ★話しかけられた言葉を捨てない（2026-09-05・実害）
         返事の処理中に話した言葉が消えていた（実測で確認）。
         ★人は返事を待たずに喋る。捨てずに順番待ちにする。 */
      const pending = [];
      let busy = false;

      /* ★セッションをまたぐ記憶（2026-09-14）
         配信者の発話だけを端末内に残し、次に開いたとき「前回の話」を1つだけ応援役に渡す。
         ★会話を外に送らない方針はそのまま（保存先は localStorage だけ）。 */
      const MEMORY_KEY = 'characterlive.memory';
      let memoryItems = [];
      try { memoryItems = parseMemory(localStorage.getItem(MEMORY_KEY)); } catch { /* no-op */ }
      /** このセッションで拾う「前回の話」。開いた時点で1つだけ決める（途中で変えない） */
      const memoryLine = pickup(memoryItems, Date.now());
      if (memoryLine) console.info(`前回の話を1つ持っています:「${memoryLine}」（応援役・クラウド頭脳のときだけ使う）`);
      function rememberSaid(text) {
        memoryItems = remember(memoryItems, { text, tMs: Date.now() });
        try { localStorage.setItem(MEMORY_KEY, serializeMemory(memoryItems)); } catch { /* no-op */ }
      }
      /** 直前の思考時間。★相槌を出すか決めるのに使う（速いときは挟まない） */
      let lastThinkMs = 9999;
      /* ★声の調子を覚える（その人の平常時と比べるため）
         ★絶対値では判断しない。大きい声の人と小さい声の人がいる。 */
      const tone = createToneTracker();
      /** 直前の発話の声の調子 */
      let lastTone = 'flat';

      /** 再生中の音声（次を鳴らす前に止める） */
      let playing = null;
      /* ★再生終了の合図からマイクを開き直すまでの間（2026-09-14）
         250ms では台詞の後半をマイクが拾った（実害: ログの「あなた」行に台詞の尻尾が入った）。
         'ended' の合図と実際に音が止まるまでにずれがある（出力側のバッファ）。
         ★700ms は暫定。「（エコー）」の行が出る頻度で調整する。 */
      const UNMUTE_MS = 700;

      /** ログの別ウィンドウ（開いていれば同じ行をそちらにも出す） */
      let logWin = null;
      /** 別ウィンドウの状態表示に流す口（開いている間だけ関数が入る） */
      let popupState = null;
      /** マイクのトグル（音声入力が使える環境でだけ入る。別ウィンドウの🎤から呼ぶ） */
      let micToggle = null;

      /* ★ログの発言者アイコン（2026-09-14・ユーザー要望「自分の声が判別つくようにアイコンを」）
         あなた＝マイクの丸いバッジ／3人＝それぞれの顔（LPと同じ重ね絵）／それ以外＝小さな点。
         ★画像は絶対URLにする（別ウィンドウは about:blank なので相対パスが解決できない）。 */
      const FACE_BASE = { rinku: 'link', konta: 'kitsune', tanunee: 'tanuki' };
      function avatarFor(who) {
        const av = document.createElement('span');
        if (who === 'あなた') {
          av.className = 'av av--me';
          av.textContent = '🎙';
          av.title = 'あなた';
          return av;
        }
        const id = PERSONA_IDS.find((k) => PERSONAS[k].displayName === who);
        if (!id) { av.className = 'av av--sys'; return av; }
        av.className = 'av';
        const base = FACE_BASE[id];
        for (const part of [`${base}-yukkuri-face-base.png`, `${base}-yukkuri-eyes-normal.png`, `${base}-yukkuri-mouth-closed.png`]) {
          const img = document.createElement('img');
          img.src = new URL(`assets/characters/${id === 'rinku' ? 'link' : id}/${part}`, location.href).href;
          img.alt = '';
          img.decoding = 'async';
          av.appendChild(img);
        }
        return av;
      }

      function log(who, text, ms) {
        const p = document.createElement('p');
        p.className = 'msg' + (who === 'あなた' ? ' me' : '');
        p.appendChild(avatarFor(who));
        p.insertAdjacentHTML('beforeend', `<span class="msg__body"><b></b> <span></span></span>`);
        p.querySelector('b').textContent = who + '：';
        p.querySelector('.msg__body > span').textContent = text;
        if (ms != null) {
          const s = document.createElement('span');
          s.className = 'ms';
          s.textContent = `${ms}ms`;
          p.appendChild(s);
        }
        logEl.appendChild(p);
        logEl.scrollTop = logEl.scrollHeight;
        // ★たたんでいる／別窓に出している間も、最後の1行は本体に見せる
        $('logLast').textContent = `${who}：${text}`;
        // ★別ウィンドウにも同じ行を出す（閉じられていたら戻す）
        if (logWin && !logWin.closed) {
          const plog = logWin.document.getElementById('log') || logWin.document.body;
          plog.appendChild(p.cloneNode(true));
          plog.scrollTop = plog.scrollHeight;
        } else if (logWin) {
          logWin = null;
          document.body.classList.remove('log-detached');
          $('logPop').textContent = '別ウィンドウ';
        }
      }

      /* ★ログを分離する（2026-09-14・ユーザー報告「ログが溜まると上に行く」）
         たたむ: ログ欄を隠して舞台を広くする。別ウィンドウ: 配信画面と分けて読める。 */
      $('logFold').addEventListener('click', () => {
        const folded = document.body.classList.toggle('log-folded');
        $('logFold').textContent = folded ? 'ひらく' : 'たたむ';
      });
      $('logPop').addEventListener('click', () => {
        if (logWin && !logWin.closed) {
          logWin.close();
          logWin = null;
          document.body.classList.remove('log-detached');
          $('logPop').textContent = '別ウィンドウ';
          return;
        }
        const w = window.open('', 'characterlive-log', 'width=520,height=680,resizable=yes,scrollbars=yes');
        if (!w) { log('（ログ）', '別ウィンドウを開けませんでした（ポップアップがブロックされています）'); return; }
        /* ★別ウィンドウには入力欄も載せる（2026-09-14・ユーザー要望「分離した部分にコメント欄を」）
           about:blank は開いた側と同一オリジンなので、こちらから直接イベントを付けられる。
           入力は本体の speak() へ、マイクは本体のトグルへ流す（処理は1か所のまま）。 */
        const d = w.document;
        d.open();
        d.write('<!doctype html><meta charset="utf-8"><title>characterlive — 会話ログ</title>');
        d.write('<style>html,body{height:100%}body{margin:0;display:flex;flex-direction:column;background:#fff3e6;color:#2c2117;font:14px/1.8 system-ui,"Segoe UI","Hiragino Kaku Gothic ProN",sans-serif}'
          + '#log{flex:1;overflow-y:auto;padding:12px 16px}.msg{margin:0 0 8px;display:flex;gap:8px;align-items:flex-start}.msg b{color:#14375c}.msg.me{color:#5f5346}.msg.me .msg__body{background:#fff;border-radius:10px;padding:2px 10px}.ms{font-size:11px;color:#5f5346;margin-left:6px}'
          + '.av{flex:none;position:relative;width:28px;height:28px;margin-top:1px}.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.av--me{border-radius:50%;background:#c8721c;color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px}.av--sys::before{content:"";position:absolute;left:11px;top:11px;width:6px;height:6px;border-radius:50%;background:#e8dccd}'
          + '.bar{padding:10px 12px 12px;background:#fff;border-top:1px solid #e8dccd}.row{display:flex;gap:8px}'
          + 'input{flex:1;font:inherit;padding:11px 12px;border:1.5px solid #e8dccd;border-radius:10px;min-width:0}input:focus{outline:2px solid #1c4b7d;border-color:transparent}'
          + 'button{font:inherit;font-weight:700;padding:10px 16px;border:0;border-radius:10px;background:#c8721c;color:#fff;cursor:pointer;min-height:44px}'
          + '.mic{background:#fff;border:1.5px solid #e8dccd;color:#1c4b7d;width:48px;padding:0;font-size:18px}.mic.is-on{background:#b3261e;border-color:#b3261e;color:#fff}'
          + '.st{font-size:12px;color:#5f5346;margin-top:6px;min-height:1.6em}</style>');
        d.write('<div id="log"></div><div class="bar"><div class="row"><button type="button" class="mic" id="pmic" title="押すと聞き始めます。もう一度押すと止まります">🎤</button>'
          + '<input id="psay" type="text" placeholder="ここからも話しかけられます（例: たぬ姉、今日うまくいかなかった）" autocomplete="off"><button type="button" id="psend">話す</button></div><div class="st" id="pst"></div></div>');
        d.close();
        const plog = d.getElementById('log');
        for (const n of logEl.children) plog.appendChild(n.cloneNode(true));
        plog.scrollTop = plog.scrollHeight;
        const psay = d.getElementById('psay');
        const sendFromPopup = () => { const t = psay.value; psay.value = ''; speak(t); };
        d.getElementById('psend').addEventListener('click', sendFromPopup);
        psay.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendFromPopup(); });
        const pmic = d.getElementById('pmic');
        if (micToggle) {
          pmic.addEventListener('click', () => { micToggle(); pmic.classList.toggle('is-on', !!ptt?.isHolding); });
        } else {
          pmic.disabled = true;
          pmic.title = '音声入力が使えません';
        }
        // ★本体の状態表示（聞いています／考えています／話しています）を別窓にも映す
        popupState = (text) => { const el = d.getElementById('pst'); if (el) el.textContent = text || ''; pmic.classList.toggle('is-on', !!ptt?.isHolding); };
        w.addEventListener('unload', () => { popupState = null; });
        psay.focus();
        logWin = w;
        document.body.classList.add('log-detached');
        $('logPop').textContent = '戻す';
      });

      // ---- 使えるものを最初に測って表示する（推測で動かさない） ----
      let voiceOk = false;
      /** 3人の声（配信者が選んだもの。localStorage に残る） */
      let voices = loadVoices();

      /**
       * 声を選ぶ欄を作る。
       * ★押したら鳴ることが必須。127スタイルあるが、名前を読んでも声は分からない。
       */
      async function buildVoicePicker() {
        const choices = await fetchVoiceChoices();
        if (!choices.length) return; // VOICEVOX未起動なら出さない（できないことを見せない）

        const list = $('voiceList');
        list.textContent = '';
        for (const id of ['rinku', 'konta', 'tanunee']) {
          const row = document.createElement('div');
          row.className = 'vrow';

          const name = document.createElement('b');
          name.textContent = PERSONAS[id].displayName;

          const sel = document.createElement('select');
          for (const c of choices) {
            const o = document.createElement('option');
            o.value = String(c.styleId);
            o.textContent = c.label;
            sel.appendChild(o);
          }
          sel.value = String(voices[id]);

          const play = document.createElement('button');
          play.type = 'button';
          play.className = 'mini';
          play.textContent = '▶ 聞く';

          // ★選んだ瞬間に鳴らす。選んで保存してから確かめる、では手間が多い
          const preview = async () => {
            play.disabled = true;
            try {
              const wav = await synthesize(sampleLine(id), { styleId: Number(sel.value) });
              if (wav) {
                playing?.stop();
                ptt?.mute();   // ★試聴中もマイクに入れない
                playing = playWav(wav);
                await playing.done;
                setTimeout(() => ptt?.unmute(), UNMUTE_MS);
              }
            } finally { play.disabled = false; }
          };
          sel.addEventListener('change', () => {
            voices[id] = Number(sel.value);
            saveVoices(voices);
            preview();
          });
          play.addEventListener('click', preview);

          row.append(name, sel, play);
          list.appendChild(row);
        }

        $('voiceReset').addEventListener('click', () => {
          voices = resetVoices();
          [...list.querySelectorAll('select')].forEach((sel, i) => {
            sel.value = String(voices[['rinku', 'konta', 'tanunee'][i]]);
          });
        });
        $('voices').hidden = false;
      }
      /* ★頭脳の選択を復元（2026-09-07）。URL の ?brain= が最優先、次に前回の選択。
         ★既定は内蔵AI。Fable は鍵がサーバに無いと動かないので、勝手に既定にしない。 */
      const BRAIN_KEY = 'characterlive.brain';
      {
        const fromUrl = new URLSearchParams(location.search).get('brain');
        let saved = null;
        try { saved = localStorage.getItem(BRAIN_KEY); } catch { /* no-op */ }
        $('brain').value = setBrain(fromUrl || saved || 'nano');
      }
      function aiStatusHtml(ai) {
        return `<span class="dot ${ai.ok ? 'ok' : 'ng'}"></span>AI: ${BRAINS[getBrain()].label} … ${ai.ok ? '使える' : (ai.reason || '使えない')}`;
      }
      /* ★公開ページ（https://characterlive.link）から VOICEVOX は呼べない（2026-09-14・実測）
           VOICEVOX は Origin が localhost 以外だと 403 を返す（CORS の既定 = localapps）。
           起動していても届かないので「未起動」と出すのは誤診。開き方を案内する。 */
      const isLocalPage = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
      function voiceStatusHtml(vv) {
        if (vv) return ' &nbsp; <span class="dot ok"></span>声: VOICEVOX 起動中';
        if (!isLocalPage) {
          return ' &nbsp; <span class="dot ng"></span>声: 公開ページからは VOICEVOX に届きません'
            + '（起動していても 403 で拒否されます。声を使うときは <code>npm run talk</code> → localhost で開く）';
        }
        return ' &nbsp; <span class="dot ng"></span>声: VOICEVOX 未起動（文字だけ）';
      }
      $('brain').addEventListener('change', async () => {
        const chosen = setBrain($('brain').value);
        try { localStorage.setItem(BRAIN_KEY, chosen); } catch { /* no-op */ }
        $('status').innerHTML = aiStatusHtml({ ok: false, reason: '確認中…' }) + voiceStatusHtml(voiceOk);
        const ai = await probeAi();
        $('status').innerHTML = aiStatusHtml(ai) + voiceStatusHtml(voiceOk);
        log('（頭脳）', `${BRAINS[chosen].label} に切り替え: ${ai.ok ? '使える' : (ai.reason || '使えない')}`);
      });
      (async () => {
        const [ai, vv] = await Promise.all([probeAi(), isVoicevoxAlive()]);
        voiceOk = vv;
        $('status').innerHTML = aiStatusHtml(ai) + voiceStatusHtml(vv);
        if (!vv) $('voice').checked = false;
        if (vv) buildVoicePicker();
        /* ★相槌を作り置きする（2026-09-06）
           ★返事を作っている1.9秒（推論1300+合成600）が無音になり、
             そこで「会話が止まった」と感じていた。人間の会話に無音の1.9秒はない。
           ★作り置きしておけば0msで鳴る（その場で合成すると339msかかる・実測）。 */
        if (vv) {
          warmUpBackchannels(voices).then((r) => {
            if (r.ok) console.info(`相槌を${r.made}個 作り置き（${r.ms}ms）`);
          });
        }
        // ★AIが準備中でも会話は成立する（決め打ちの返事＋声）。使えない、と誤解させない。
        if (!ai.ok && vv) {
          $('status').innerHTML += ' &nbsp;<span style="color:var(--muted)">※AIが準備中でも声は出ます</span>';
        }
        // ★'downloadable' は「待っても始まらない」状態。クリックが要る（実測で判明）。
        //   ボタンを出さないと永久に準備中のままになる。
        if (ai.state === 'downloadable') {
          const btn = document.createElement('button');
          btn.className = 'mini';
          btn.textContent = 'AIを準備する';
          btn.style.marginLeft = '8px';
          btn.addEventListener('click', async () => {
            btn.disabled = true;
            btn.textContent = '準備中… 0%';
            const r = await startAiDownload((p) => {
              btn.textContent = `準備中… ${Math.round(p * 100)}%`;
            });
            if (r.ok) {
              btn.remove();
              const again = await probeAi();
              $('status').innerHTML = aiStatusHtml(again) + voiceStatusHtml(true);
            } else {
              btn.disabled = false;
              btn.textContent = 'AIを準備する';
              log('（AI準備）', r.reason || '開始できませんでした');
            }
          });
          $('status').appendChild(btn);
        }
      })();

      /**
       * ★3人が1文ずつリレーする（同時発話は禁止のまま）。
       *   ★前の子の**再生が終わってから**次の子が吹き出す。
       *     文字だけ先に3つ出すと、誰が喋っているのか分からなくなる。
       */
      async function runRelay(t) {
        const members = relayMembers(3);
        for (let i = 0; i < members.length; i += 1) {
          const id = members[i];
          const persona = PERSONAS[id];

          setState('thinking', `${persona.displayName}が考えています…`);
          live.beginThinking({ charaId: id });
          const res = await think({
            charaId: id,
            text: t,
            mode: 'cheer',
            history,
            // ★リレー中の役割を渡す（受け止める/ずらす/閉じる）
            relay: relayDirective(id, i)
          });
          live.endThinking();

          if (!res.ok) continue;

          // ★禁止に触れていたら、その子は黙る（無理に喋らせない）
          const judge = checkRelayLine(res.text);
          if (!judge.ok) continue;

          lastSpeaker = id;
          history.push({ who: persona.displayName, text: res.text });
          log(persona.displayName, res.text + (res.fallback ? '（AI未準備・決め打ち）' : ''), res.ms);

          if ($('voice').checked && voiceOk) {
            setState('speaking', `${persona.displayName}が話しています`);
            const wav = await synthesize(res.text, { ...persona.voice, styleId: voices[id] });
            if (wav) {
              playing?.stop();
              live.onStreamerAddressed({
                prompt: t, answer: res.text, durationMs: 60000, charaId: id
              });
              ptt?.mute();   // ★キャラが喋る間はマイクを塞ぐ
              playing = playWav(wav, { onEnd: () => live.onCommentSpokenEnd() });
              // ★ここで待つ。次の子は前の子が鳴り終わってから。
              await playing.done;
              live.onCommentSpokenEnd();
              setTimeout(() => ptt?.unmute(), UNMUTE_MS);
              live.closeChara(id);   // ★次の子に移る前に閉じる（並べない）
            } else {
              live.onStreamerAddressed({ prompt: t, answer: res.text, durationMs: 4000, charaId: id });
              await new Promise((r) => setTimeout(r, 2200));
              live.closeChara(id);
            }
          } else {
            /* ★吹き出しは2.6秒で自然に消える長さにする。
               ★durationMs を長くすると3人ぶんが画面に並んでしまい、
                 「1人ずつリレーしている」ことが伝わらない（実測で確認）。 */
            live.onStreamerAddressed({ prompt: t, answer: res.text, durationMs: 2400, charaId: id });
            await new Promise((r) => setTimeout(r, 2600));
            live.closeChara(id);   // ★次の子に移る前に閉じる
          }
        }
        setState(null);
      }

      /**
       * ★話しかけの入口。処理中でも**捨てない**（順番待ちにする）。
       *   ユーザー報告:「いくら喋ってもログに出ない」の対処。
       */
      async function speak(text) {
        const t = String(text || '').trim();
        if (!t) return;
        // ★先にログへ出す。処理が遅れても「言ったことは残る」
        /* ★ログは必ずここで1回だけ出す（2026-09-05）
           ★speakOne 側でも出していたため、順番待ちの発言が2回出た（実測）。
             「言った言葉が残る」ことが最優先なので、入口で確実に出す。 */
        log('あなた', t + (busy ? '（順番待ち）' : ''));
        pending.push(t);
        if (busy) return;
        busy = true;
        try {
          while (pending.length) {
            await speakOne(pending.shift());
          }
        } finally {
          busy = false;
        }
      }

      /**
       * ★マイクから来た言葉の入口（2026-09-14）。キャラ自身の声の反響なら捨てる。
       *   ユーザー報告:「会話の流れが変」→ 直前にキャラが喋った文が「あなた」として返っていた。
       *   認識器を再生中に止める対策（charaListen）に加え、内容でも二重に守る。
       *   ★判定は直前3つのキャラの台詞との重なり比率（isRepeatOf・0.5）。絶対値では見ない。
       *   ★捨てたことはログに出す（黙って捨てない）。本人が本当に同じ言葉を言った場合も
       *     ここで消えるので、頻発するなら閾値を見直す。
       */
      function sendHeard(said) {
        const t = String(said || '').trim();
        if (!t) return;
        const recent = history.filter((h) => h.who !== '配信者').slice(-3);
        /* ★全体の重なり（isRepeatOf）と、拾った側から見た含まれ具合（isEchoOf）の両方で見る。
           実害: 台詞の後半だけを拾うと全体比率は 0.43 で通ってしまった（2026-09-14）。 */
        const echoOf = recent.find((h) => isRepeatOf(h.text, t, 0.5) || isEchoOf(t, h.text));
        if (echoOf) {
          log('（エコー）', `キャラの声を拾ったので捨てました:「${t}」（${echoOf.who}の台詞）`);
          return;
        }
        speak(t);
      }

      async function speakOne(text) {
        const t = String(text || '').trim();
        if (!t) return;
        // ★ボタンは無効にしない（無効の間に話した言葉が消えていたため・実測）
        $('say').value = '';
        // ★ログは入口で出し済み（ここで出すと二重になる）
        history.push({ who: '配信者', text: t });
        rememberSaid(t);   // ★次回「前の話」として1つだけ拾えるように残す

        /* ★気持ちの話なら3人でリレーする(2026-09-05・デモ用)
           1人1文 / りんく→こん太→たぬ姉 / 前の子の再生が終わってから次。
           ★何にでも3人が出ると「全員が毎ターン喋って個性が薄まる」失敗に戻る。
             打ち明け・気持ち・変わりたい、が2つ以上そろったときだけ。 */
        if ($('mode').value === 'cheer' && isHeartTalk(t)) {
          await runRelay(t);
          return;
        }

        const who = pickResponder(t, lastSpeaker);
        const persona = PERSONAS[who];

        // ★考えている間は「…」を出す（間が空く理由を見せる）
        setState('thinking', '考えています…');
        live.beginThinking({ charaId: who });

        /* ★相槌は**やめた**（2026-09-06・実害）

           ユーザー報告:「こんたが けーえ ってすぐさけぶ。
                         そのあと、めちゃおくれてこうなる。grokはこんな風にならない」

           ★私は「遅さを相槌で隠す」つもりだったが、逆効果だった:
             - 先に「へえ！」と叫び、そのあと11秒待たされる
             - ★相槌は遅さを隠さない。**遅さを目立たせる**道具になっていた
           ★Grokは相槌を挟まない。速いから要らない。
             隠すのではなく、速くするのが正しい。 */

        const res = await think({
          charaId: who, text: t, mode: $('mode').value, history, tone: lastTone,
          memory: { line: memoryLine }   // ★応援役・クラウド頭脳のときだけ think が使う
        });
        lastThinkMs = res.ms ?? lastThinkMs;
        live.endThinking();

        if (!res.ok) {
          setState(null);
          log('（エラー）', res.reason || '返事を作れませんでした');
          return;
        }

        lastSpeaker = who;
        history.push({ who: persona.displayName, text: res.text });
        // ★AIが使えず固定台詞を返した場合は隠さず示す（実測を偽らない）
        //   ★オウム返しを言い直させた場合も印を出す（頻度を見るため）
        log(persona.displayName, res.text + (res.fallback ? '（AI未準備・決め打ち）' : '') + (res.rephrased ? '（写しだったので言い直し）' : ''), res.ms);

        // ★口パクは「音が鳴った瞬間」に合わせる。文字表示に合わせると声より先に口が動く。
        if ($('voice').checked && voiceOk) {
          // ★配信者が選んだ声を使う（人格の既定より優先）
          setState('speaking', `${persona.displayName}が話しています`);
          const wav = await synthesize(res.text, { ...persona.voice, styleId: voices[who] });
          if (wav) {
            playing?.stop();
            live.onStreamerAddressed({
              prompt: t,
              answer: res.text,
              durationMs: 60000, // 音が終わったら閉じるので長めに取る
              // ★声を出す子と、吹き出しに出る名前を必ず一致させる
              charaId: who
            });
            /* ★キャラが喋る間はマイクを塞ぐ（2026-09-06・実害）
               ユーザー報告:「キャラ喋った声が入力されてる」
               ★マイクとスピーカーが同じ部屋にある以上、必ず起きる。
                 仕組みは前からあったのに、一度も呼んでいなかった。 */
            ptt?.mute();
            playing = playWav(wav, { onEnd: () => live.onCommentSpokenEnd() });
            await playing.done;
            live.onCommentSpokenEnd();
            /* ★少し待ってから解除する。
               再生が終わった瞬間はまだ残響が入るため（実測で決めた値ではないので、
               入力に混ざるようなら伸ばす）。 */
            setTimeout(() => ptt?.unmute(), UNMUTE_MS);
            /* ★吹き出しを閉じる（2026-09-06・実害「ふきだしがでっぱなし」）
               ★onCommentSpokenEnd は相槌(react)しか閉じない。
                 通常の返事は answer なので閉じられず、durationMs=60000 のまま
                 60秒残り、次の返事と並んでいた。
               ★リレー側には closeChara を足したのに、こちらは漏れていた。 */
            live.closeChara(who);
          } else {
            live.onStreamerAddressed({ prompt: t, answer: res.text, durationMs: 4000, charaId: who });
          }
        } else {
          live.onStreamerAddressed({ prompt: t, answer: res.text, durationMs: 4000, charaId: who });
        }
        setState(null);
      }

      /* ------------------------------------------------------------------ *
       * ★場を聞く（2026-09-08・_docs/ROOM-LISTENING-DESIGN.md）
       *
       *   真因は「文脈を持っていない」こと。断片（「じゃないですか」）に1つずつ
       *   返していたのがオウム返しと「止まる」の正体。
       *   ★この経路は pending キューを通らない（古い断片への返事が後から出る原因）。
       *   ★sendTimer も動かさない。聞こえた確定文は耳(transcript)に貯めるだけ。
       *   ★拍は 500ms ティッカーで見る（測り方を実装と揃える。発話のたびに見ると
       *     ROOM_LULL_MS=1200 でも通ってしまう偽の緑になる）。
       * ------------------------------------------------------------------ */
      let roomOn = false;
      let transcript = makeTranscript();
      /** 前回の拍（発火した時刻）。charsSince の起点 */
      let lastBeatAt = 0;
      /** 前回キャラが喋り終えた時刻 */
      let lastCharaAt = null;
      let roomBusy = false;
      let roomTicker = null;

      function tickRoom() {
        if (!roomOn || roomBusy || busy) return;
        const now = Date.now();
        const beat = resolveBeat({
          nowMs: now,
          lastHeardAt: lastHeardAt(transcript),
          charsSinceLastBeat: charsSince(transcript, lastBeatAt),
          lastCharaAt
        });
        if (beat.fire) speakRoom(beat, now);
      }

      /**
       * 場に一言だけ言う。★pending を使わない・断片を主役にしない。
       * @param {{fire:boolean, reason:string}} beat
       * @param {number} resolvedAt 拍を決めた時刻
       */
      async function speakRoom(beat, resolvedAt) {
        roomBusy = true;
        lastBeatAt = resolvedAt;
        try {
          const window_ = windowText(transcript, { nowMs: resolvedAt, spanMs: 60_000, maxChars: 800 });
          const digest = buildRoomDigest({ window: window_, brain: getBrain() });
          if (!digest) return;

          const who = pickResponder('', lastSpeaker);
          const persona = PERSONAS[who];
          setState('thinking', `${persona.displayName}が考えています…`);
          live.beginThinking({ charaId: who });
          const res = await think({
            charaId: who, text: '', mode: $('mode').value, history, tone: lastTone,
            room: { digest },
            memory: { line: memoryLine }
          });
          live.endThinking();

          // ★決めてから合成が終わるまでに場が進みすぎたら捨てる（古い話への返事を防ぐ）
          const stale = isStaleBeat({ resolvedAt, nowMs: Date.now() });
          /* ★計器: 拍理由 / 窓字数 / 入力字数 / 推論ms を1行で出す。
             ★入力字数は Nano の上限（実測320〜350字）を超えていないかを見るため。
               超えると create が失敗して決め打ちに落ち、画面上は正常に見える（潜伏型）。 */
          log('（拍）', `${beat.reason} 窓${digest.length}字 入力${res.userChars ?? '?'}字 推論${res.ms}ms`
            + (stale ? ' 古いので捨てた' : '')
            + (res.fallback ? ` 決め打ちに落ちた（${res.reason || ''}）` : ''));
          /* ★場では決め打ち台詞を言わない。1対1なら「黙らない」が正しいが、
             場に向かって毎拍「ボク見てたよ」を言うのは雑音になる。 */
          if (!res.ok || stale || res.fallback) return;

          lastSpeaker = who;
          history.push({ who: persona.displayName, text: res.text });
          log(persona.displayName, res.text, res.ms);
          await playReply(who, res.text, digest.slice(-40));
        } finally {
          roomBusy = false;
          if (roomOn) setState('listening', '場を聞いています…');
          else setState(null);
        }
      }

      /**
       * 返事を声にして出す（場モード用）。
       * ★再生中はマイクを塞ぎ、その区間を耳に「…」として記録する
       *   （聞けていない所を前後と繋げて復元させない）。
       */
      async function playReply(who, text, promptText) {
        const persona = PERSONAS[who];
        if ($('voice').checked && voiceOk) {
          setState('speaking', `${persona.displayName}が話しています`);
          const wav = await synthesize(text, { ...persona.voice, styleId: voices[who] });
          if (wav) {
            playing?.stop();
            live.onStreamerAddressed({ prompt: promptText, answer: text, durationMs: 60000, charaId: who });
            ptt?.mute();
            const fromMs = Date.now();
            playing = playWav(wav, { onEnd: () => live.onCommentSpokenEnd() });
            await playing.done;
            live.onCommentSpokenEnd();
            setTimeout(() => ptt?.unmute(), UNMUTE_MS);
            transcript = markBlackout(transcript, { fromMs, toMs: Date.now() + 250 });
            lastCharaAt = Date.now();
            live.closeChara(who);
            return;
          }
        }
        live.onStreamerAddressed({ prompt: promptText, answer: text, durationMs: 4000, charaId: who });
        lastCharaAt = Date.now();
      }

      /* ------------------------------------------------------------------ *
       * ★マイク（押している間だけ聞く）
       *
       *   Grok本人の助言(2026-09-04・音声で相談):
       *     「常時オンは配信には向かない。ゲーム音やBGM、独り言を全部拾って、
       *       3人が同時に反応してカオスになる」
       *     「プッシュトゥトークを既定にする。配信者は配信中ずっとボタンを
       *       握ってるわけにもいかないから、ショートカットキーでオンオフ」
       *   → 既定は押して話す。スペースキーでも押せる。
       * ------------------------------------------------------------------ */
      function setState(s, text, allowHtml = false) {
        const el = $('state');
        // ★別ウィンドウにも同じ状態を映す（HTML は渡さない・文字だけ）
        try { popupState?.(s ? String(text).replace(/<[^>]+>/g, '') : ''); } catch { /* 閉じられた直後は無視 */ }
        if (!s) { el.hidden = true; return; }
        el.hidden = false;
        el.dataset.s = s;
        // ★既定は textContent（外から来た文字をそのまま HTML にしない）。
        //   注意書きだけは自前の固定文なので HTML を許す。
        if (allowHtml) $('stateText').innerHTML = text;
        else $('stateText').textContent = text;
      }

      /* ★マイクの状態を常に見せる（押す前から分かるように）。
         「使用中」は Chrome が出すものだが、こちらでも赤く点滅させて同じことを伝える。 */
      function renderMicState(state, live = false) {
        const el = $('micState');
        const d = describeMicPermission(state);
        el.className = 'micst ' + (live ? 'is-live' : (d.ok ? (state === 'granted' ? 'is-ok' : '') : 'is-ng'));
        el.textContent = '';
        const dot = document.createElement('span');
        dot.className = 'micst__dot';
        const txt = document.createElement('span');
        txt.textContent = live ? 'マイク 使用中' : d.label + (d.hint ? ` — ${d.hint}` : '');
        el.append(dot, txt);
      }

      const listenable = canListen();
      let ptt = null;
      /** 押している間に聞き取った文（確定分） */
      let heardFinal = '';
      /** 話し終わりを待つタイマー（黙って2秒でこちらから送る） */
      let sendTimer = null;
      /** 途中経過が変わらなくなったら送る保険タイマー（確定が来ない認識器向け・2026-09-14） */
      let interimTimer = null;
      /** 途中経過から送った文（同じ確定が後から来たら捨てる） */
      let interimSent = '';

      if (!listenable.ok) {
        $('mic').disabled = true;
        $('mic').title = listenable.reason || '音声入力が使えません';
        $('micState').className = 'micst is-ng';
        $('micState').textContent = listenable.reason || '音声入力が使えません';
      } else {
        // 押す前から状態を出す。設定を変えたら自動で反映する。
        micPermission().then((st) => renderMicState(st));
        watchMicPermission((st) => renderMicState(st, ptt?.isHolding));

        /* ★端末内で音声認識できるなら、そちらを使う（2026-09-06）
           ★従来の webkitSpeechRecognition は音声をGoogleへ送っている。
             「全部ローカル」と言いながら、聞いた声だけ外に出ていた。
           ★使えなければ黙って従来方式に戻る（使えないのは異常ではない）。 */
        let preferLocal = false;
        probeLocalRecognition().then((r) => {
          preferLocal = r.ok;
          console.info(`端末内での音声認識: ${r.ok ? '使える' : (r.reason || '使えない')}`);
        });

        ptt = createPushToTalk({
          get preferLocal() { return preferLocal; },
          // ★開発用の手: globalThis.__hear({final, text}) でマイク無しに同じ経路へ流し込める
          onHeard: (globalThis.__hear = ({ final, text }) => {
            /* ★途中経過(final=false)と確定(final=true)を区別する。

               ユーザー報告(2026-09-05):「自分のことばがうまくログに残らないかも」
               実害のログ:「しゃべれる」「のに」「あーなるほど」
                 = ★言い終わる前に、途中の認識結果がそのまま送信されていた。

               真因は2つ:
                 ① 途中経過でも送信タイマーを動かしていた
                    → 言っている最中に2秒経つと、その時点の文字が送られる
                 ② 途中経過を heardFinal に足していなかったため、
                    確定前に送ると**言った言葉の一部しか残らない**
               → ★確定した文だけでタイマーを動かす。
                 途中経過は画面に映すだけで、送信の判断には使わない。 */
            /* ★場を聞くモード（2026-09-08）: 確定文を耳に貯めるだけ。
               ★sendTimer を動かさない・speak() に渡さない・history に「配信者」として入れない。
               喋るかどうかは拍（tickRoom）が決める。 */
            /* ★確定が来ない認識器への保険（2026-09-14・実害）
               ユーザー報告:「出てきても会話が届いたことにならず止まっている」
               画面は「聞いています…「本当に」」のまま＝途中経過は届くのに確定(final)が来ない。
               端末内の音声認識は、区切りを打たず途中経過を返し続けることがある。
               → 途中経過の文字が一定時間変わらなければ、確定とみなして送る。
                 待ち時間は確定と同じ「文の完結度」で決め、少し余分に待つ（途中経過は揺れるため）。
               ★同じ文の確定が後から来たら二重に送らない（interimSent で照合）。 */
            if (!final && text) {
              const stable = heardFinal + text;
              clearTimeout(interimTimer);
              interimTimer = setTimeout(() => {
                const said = stable.trim();
                if (!said || said === interimSent) return;
                if (($('say').value || '').trim() !== said && !roomOn) return;   // まだ揺れている
                interimSent = said;
                if (roomOn) {
                  transcript = appendFinal(transcript, { text: said, tMs: Date.now(), source: 'room' });
                  return;
                }
                heardFinal = '';
                $('say').value = '';
                log('（認識）', `確定が来ないので途中経過から送ります:「${said}」`);
                sendHeard(said);
              }, resolveTurnEnd(stable).waitMs + 600);
            }
            if (final) {
              clearTimeout(interimTimer);
              // ★途中経過から既に送った文と同じなら捨てる（二重送信を防ぐ）
              const t = (heardFinal + text).trim();
              if (interimSent && (t === interimSent || interimSent.endsWith(t) || t.endsWith(interimSent))) {
                interimSent = '';
                heardFinal = '';
                $('say').value = '';
                return;
              }
              interimSent = '';
            }
            if (roomOn) {
              if (final) transcript = appendFinal(transcript, { text, tMs: Date.now(), source: 'room' });
              if (!roomBusy) setState('listening', '場を聞いています…' + (text ? `「${text}」` : ''));
              return;
            }
            if (final) {
              heardFinal += text;
              $('say').value = heardFinal;
            } else {
              // 途中経過は表示だけ（確定分＋いま聞こえている分）
              $('say').value = heardFinal + text;
            }
            setState('listening', '聞いています…' + ($('say').value ? `「${$('say').value}」` : ''));

            /* ★送るのは「確定した言葉があって、そのあと黙ったとき」だけ。
               途中経過で送ると、言い終わる前に切られる（上記の実害）。 */
            if (!final) return;
            clearTimeout(sendTimer);
            if (heardFinal.trim()) {
              sendTimer = setTimeout(() => {
                const said = heardFinal.trim();
                // ★!ptt.isHolding での早期 return をやめた（2026-09-06）
                //   マイクを止めた直後にタイマーが発火すると、言った言葉が消えていた。
                if (!said) return;
                // ★声の調子を確定する（この一区切りをどう喋ったか）
                lastTone = readTone(tone.end(Date.now(), said.length)).tone;
                heardFinal = '';
                $('say').value = '';
                sendHeard(said);
              }, resolveTurnEnd(heardFinal).waitMs);
              /* ★待ち時間を「文の完結度」で変える（2026-09-06）
                 ★実測: 1往復に5.4秒かかっていた。
                   内訳 = 話し終わり待ち3500 + 返事開始2000 + 推論1300 + 合成600。
                   人間同士の会話は平均208ms（Stivers 2009）。★桁が2つ違う。
                 ★3500msは「無音を数えていただけ」。ここが一番の無駄だった。
                   無音の長さだけで判断すると、必ずどちらかで失敗する:
                     短くする → 言葉を奪う（実害:「しゃべれる」「のに」だけが残った）
                     長くする → 会話にならない（いまの状態）
                 → 言い切っていれば250ms、続きそうなら2500ms。
                   Grokが無音ではなく「文が完結したか」で判断しているのと同じ考え。 */
            }
          }),
          onState: (st) => {
            if (st === 'listening') setState('listening', '聞いています…');
          },
          onError: (reason) => {
            /* ★聞き取れなかっただけならマイクは止めない（2026-09-05）
               ユーザー報告:「いくら喋っても自分のログが出ない」
               ★聞き取り失敗のたびにマイクが切れると会話が続かない。
                 ログには出す（黙って捨てない）が、聞き続ける。 */
            log('（マイク）', reason);
            if (reason.includes('聞き取れませんでした')) {
              setState('listening', roomOn ? '場を聞いています…' : '聞いています…');
              return;
            }
            /* ★場を聞くモードでマイクが使えないなら、モードごと降ろす（2026-09-08）。
               押しっぱなし扱いのままだと 400ms ごとに再起動→失敗を繰り返し、
               ログが「許可されていません」で埋まる（実測）。 */
            if (roomOn && reason.includes('許可されていません')) {
              $('room').checked = false;
              $('room').dispatchEvent(new Event('change'));
              return;
            }
            setState(null);
            $('mic').classList.remove('is-on');
          }
        });

        /* ★音量計。押している間だけ動かす。
           これが動く = マイクが本当に音を拾えている、という証拠になる。
           ★認識APIとは別経路なので「波は動くのに文字にならない」なら
             マイクは生きていて認識だけが失敗している、と切り分けられる。 */
        const bars = [...$('micBars').querySelectorAll('i')];
        let meter = null;
        let sawSound = false;      // 押している間に一度でも音が入ったか
        let silentFrames = 0;
        let warnedSilent = false;   // 無音の警告は1回だけ

        const drawLevel = (lv) => {
          if (lv > 0.12) { sawSound = true; silentFrames = 0; } else { silentFrames += 1; }
          tone.push(lv);   // ★声の調子を覚える
          // 中央が高い山にする（棒が5本とも同じ高さだと機械的に見える）
          const shape = [0.45, 0.75, 1, 0.75, 0.45];
          bars.forEach((b, i) => {
            // 3px(無音)〜19px(大声)。★実測して「動いて見える」幅にした。
            // 0.19(無音・約3px) 〜 1.0(大声・16px)
            b.style.transform = `scaleY(${(0.19 + lv * shape[i] * 0.81).toFixed(3)})`;
          });
          // ★押しているのに無音が続いたら伝える（黙って失敗させない）
          if (!sawSound && !warnedSilent && silentFrames > 90) {
            warnedSilent = true;   // ★1回だけ出す(毎フレーム書き換えると繰り返して見える)
            setState('listening', '聞いています… <span class="state__warn">（音が入っていません。マイクを確認してください）</span>', true);
          }
        };

        const micOn = async () => {
          if (ptt.isHolding) return;
          heardFinal = '';
          sawSound = false;
          silentFrames = 0;
          tone.begin(Date.now());
          $('say').value = '';
          $('mic').classList.add('is-on');
          $('micBars').hidden = false;
          renderMicState('granted', true); // ★使用中（赤く点滅）
          setState('listening', '聞いています…');
          ptt.begin();
          // 音量計は認識とは独立に開く（片方が失敗しても、もう片方は動く）
          meter = await startMicLevel({
            onLevel: drawLevel,
            onError: (reason) => log('（マイク音量）', reason)
          });
        };
        const micOff = () => {
          if (!ptt.isHolding) return;
          clearTimeout(sendTimer);
          clearTimeout(interimTimer);
          $('mic').classList.remove('is-on');
          $('micBars').hidden = true;
          micPermission().then((st) => renderMicState(st));
          bars.forEach((b) => { b.style.transform = 'scaleY(0.19)'; });
          meter?.stop();
          meter = null;
          ptt.end();
          /* ★言った言葉を捨てない（2026-09-06・実害のもう1つの経路）
             ★sendTimer は「言い切らない文なら2500ms待つ」ので、
               その前にマイクを止めると clearTimeout され、内容が消えていた。
             → ★heardFinal に残っていれば、そちらを優先して必ず送る。 */
          const said = (heardFinal.trim() || $('say').value.trim());
          heardFinal = '';
          setState(null);
          if (said) sendHeard(said);
          /* ★ここでは警告を出さない（2026-09-04・実害）
             ユーザー報告:「音が入っていませんでした」が2回出て画面がうるさい。
             ★原因は状態バーとログの**両方**が同じことを言っていたこと。
               同じ原因のメッセージは1箇所だけにする。状態バー側を残す
               （キャラの吹き出しと場所が競合しないため）。 */
        };

        /* ★1回押したら聞き続ける（トグル）。押しっぱなしにしない。
           ユーザー報告(2026-09-04):「左クリックを押したら一瞬こうなるけどすぐもどっちゃう」
           「grokは1回おしたら」
           → ★Grokは1回押すと聞き続ける方式だった。押しっぱなしは
             pointerleave で指/カーソルが少しずれただけで切れるので、
             配信中には使えない（実際にそれで切れていた）。
           ★もう1回押すか、話し終わって間が空けば止まる。 */
        $('mic').addEventListener('click', (e) => {
          e.preventDefault();
          if (ptt.isHolding) micOff();
          else micOn();
        });
        // ★別ウィンドウの🎤からも同じ切り替えを呼べるようにする
        micToggle = () => { if (ptt.isHolding) micOff(); else micOn(); };

        // ★スペースキーも同じくトグル（配信中にキーを押し続けなくてよい）
        globalThis.addEventListener('keydown', (e) => {
          if (e.code !== 'Space' || e.repeat) return;
          if (document.activeElement === $('say')) return;
          e.preventDefault();
          if (ptt.isHolding) micOff();
          else micOn();
        });

        /* ★場を聞く（2026-09-08）。ON でマイクを開き、拍を 500ms ごとに見る。
           OFF で拍を止め、マイクも閉じる。★既定は OFF（押して話すが既定）。 */
        $('room').addEventListener('change', async (e) => {
          roomOn = e.target.checked;
          if (roomOn) {
            transcript = makeTranscript();
            lastBeatAt = 0;
            if (!ptt.isHolding) await micOn();
            clearInterval(roomTicker);
            roomTicker = setInterval(tickRoom, 500);
            log('（場）', '場を聞く: ON。聞こえた話を貯めて、間が来たら話題に一言だけ言います');
            setState('listening', '場を聞いています…');
          } else {
            clearInterval(roomTicker);
            roomTicker = null;
            if (ptt.isHolding) micOff();
            log('（場）', '場を聞く: OFF');
          }
        });
      }
      if (!listenable.ok) $('room').disabled = true;

      $('send').addEventListener('click', () => speak($('say').value));
      $('say').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') speak($('say').value);
      });
      $('chatter').addEventListener('change', (e) => live.setChatter(e.target.checked));

      globalThis.__live = live;
      /* ★開発用の手（マイク無しで場の話を流し込む）。
         ★実装と同じ経路（耳→拍→荷物→think）を通る。UI からは触れない。 */
      globalThis.__room = {
        hear(text) { transcript = appendFinal(transcript, { text: String(text), tMs: Date.now(), source: 'room' }); },
        get transcript() { return transcript; },
        get on() { return roomOn; }
      };
    </script>
  </body>
</html>
