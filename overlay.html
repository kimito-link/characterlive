<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>characterlive — 配信用（クロマキー）</title>
    <style>
      /*
       * ★配信用の窓（2026-09-14・ユーザー要望「クロマキーで実際の配信と共存したい」）
       *   本体（talk.html）で会話し、この窓には**キャラと吹き出しだけ**を映す。
       *   OBS で「ウィンドウキャプチャ → フィルタ: クロマキー（緑）」すれば、配信画面の上に3人が乗る。
       *   ★この窓は自分では何も考えない。本体からの合図（BroadcastChannel）で動く。
       *     本体を再読み込みしても、この窓は開いたままでよい（合図の口が同じ名前）。
       *   ★背景は ?bg=green（既定）／blue／transparent（OBS のブラウザソース用。ただしブラウザソースは
       *     別プロセスなので本体の合図が届かない＝いまは「ウィンドウキャプチャ」で使うこと）。
       */
      :root {
        --chara: clamp(140px, 26vh, 380px);
        --bubble-w: clamp(260px, 38vw, 560px);
        --bubble-fs: clamp(16px, 2.4vh, 28px);
      }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #00ff00; }
      body[data-bg="blue"] { background: #0000ff; }
      body[data-bg="magenta"] { background: #ff00ff; }
      body[data-bg="transparent"] { background: transparent; }
      #stage {
        position: absolute; inset: 0; display: flex;
        align-items: flex-end; justify-content: center; padding: 0 2vw 2vh;
      }
      #stage .nlcl-stage { gap: clamp(12px, 3vw, 72px); }
      #stage .nlcl-chara { width: var(--chara); height: var(--chara); }
      /* ★吹き出しは映像の上に乗るので、縁を太く・影を強く（読めることが最優先） */
      #stage .nlcl-chara__bubble {
        max-width: var(--bubble-w); font-size: var(--bubble-fs); line-height: 1.5;
        padding: calc(var(--bubble-fs) * 0.55) calc(var(--bubble-fs) * 0.9);
        border-radius: calc(var(--bubble-fs) * 1.1); border-width: 3px;
        box-shadow: 3px 3px 0 rgba(47, 58, 70, 0.95), 0 0 0 2px rgba(255, 255, 255, 0.9);
        bottom: calc(100% + 12px);
      }
      #stage .nlcl-chara__name { font-size: calc(var(--bubble-fs) * 0.75); margin-bottom: 2px; }
      /* 端の子の吹き出しは内側へ（部品の登場アニメが translateX(-50%) を含むので差し替える） */
      #stage .nlcl-chara:first-child .nlcl-chara__bubble,
      #stage .nlcl-chara:last-child .nlcl-chara__bubble { animation-name: overlay-pop-edge; transform: none; }
      #stage .nlcl-chara:first-child .nlcl-chara__bubble { left: 0; }
      #stage .nlcl-chara:first-child .nlcl-chara__bubble::after { left: calc(var(--chara) / 2); }
      #stage .nlcl-chara:last-child .nlcl-chara__bubble { left: auto; right: 0; }
      #stage .nlcl-chara:last-child .nlcl-chara__bubble::after { left: auto; right: calc(var(--chara) / 2 - 6px); }
      @keyframes overlay-pop-edge {
        from { opacity: 0; transform: translateY(4px) scale(0.94); }
        to   { opacity: 1; transform: none; }
      }
      /* ★本体が見つからないときだけ出す小さな案内（クロマキーで抜ける色の上には置かない） */
      #hint {
        position: absolute; left: 12px; top: 10px; font: 13px/1.6 system-ui, "Segoe UI", sans-serif;
        color: #fff; background: rgba(0, 0, 0, 0.55); padding: 6px 10px; border-radius: 8px;
      }
      #hint[hidden] { display: none; }
    </style>
  </head>
  <body>
    <main id="stage" aria-label="配信用: 3人のキャラクター"></main>
    <div id="hint">本体（talk.html）からの合図を待っています…（本体で話しかけると、ここに映ります）</div>
    <script type="module">
      import { startCharaLive } from './src/index.js';

      const bg = new URLSearchParams(location.search).get('bg') || 'green';
      document.body.dataset.bg = bg;

      /* ★この窓は自分では喋らない（chatter: false）。自発発話も本体から合図で受ける。
         自分で喋らせると、手元と配信で言葉が食い違う。 */
      const live = startCharaLive({
        doc: document,
        mount: document.getElementById('stage'),
        resolveUrl: (p) => p,
        getHeatLevel: () => 0.35,
        chatter: false
      });

      const hint = document.getElementById('hint');
      let hintTimer = setTimeout(() => { hint.hidden = false; }, 1500);

      // ★本体（talk.html）と同じ名前の口。本体を再読み込みしても繋がり直す。
      const bus = new BroadcastChannel('characterlive-stage');
      bus.onmessage = (e) => {
        const m = e.data || {};
        clearTimeout(hintTimer);
        hint.hidden = true;
        switch (m.type) {
          case 'addressed': live.onStreamerAddressed(m.input || {}); break;
          case 'thinking': live.beginThinking(m.input || {}); break;
          case 'endThinking': live.endThinking(m.input || {}); break;
          case 'close': live.closeChara(m.charaId); break;
          case 'spokenEnd': live.onCommentSpokenEnd(); break;
          case 'chatter':
            live.onStreamerAddressed({ prompt: '', answer: m.text, durationMs: m.durationMs || 4000, charaId: m.charaId });
            break;
          case 'hello': bus.postMessage({ type: 'overlay-ready' }); break;
          default: break;
        }
      };
      bus.postMessage({ type: 'overlay-ready' });

      globalThis.__overlay = live;
    </script>
  </body>
</html>
